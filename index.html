    <body onload="Hud(0)">
        <div id="mm">
            <h1>Tiny Auto Arena</h1>
            <button onclick="Hud(1)">Play Now</button>

            <p id="class_icon" class="icns" style="text-align: center">@</p>
            <p id="class_stats" style="text-align: center">Look! So many to choose from.<br><br></p>

        <div style="text-align: center">

        </div>

            <h3>Central Command</h3>
            <p id="incoming_offensive">Next Offensive: 3 Round(s)</p>
            <table>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const classButtons = document.querySelectorAll('.class_select');
            classButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const classNum = button.dataset.classNum;
                    if (classNum) {
                        if (typeof class_selection === 'function') {
                            class_selection(parseInt(classNum, 10), button);
                        }
                    }
                });
            });
        });
    </script>
