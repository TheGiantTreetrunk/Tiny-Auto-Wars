<html>
    <head>
        <title>Tiny Auto Wars</title>
        <meta charset="UTF-8">
        <meta name="MobileOptimized" content="480"/>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <meta name="keywords" content="Adventure">
        <meta name="description" content="A Game">
        <meta name="author" content="Austin Elke">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="HandheldFriendly" content="true"/>

        <link href='game_style.css?=v1.0' rel='stylesheet'>
        <script defer type="text/javascript" src="game_core.js?=v1.0"></script>
    </head>

    <body onload="Hud(0)">
        <div id="mm">
            <h1>Tiny Auto Wars</h1>
            <button onclick="Hud(1)">Play Now</button>
        </div>

        <div id="rooster">
            <table style="margin: auto; text-align: center;">
                <!-- Row 1: Fighter, Alchemist, Theologian -->
                <tr>
                    <td><button data-class-num="1" class="class_select"><a class="icns red">@</a></button></td>
                    <td><button data-class-num="2" class="class_select"><a class="icns blue">@</a></button></td>
                    <td><button data-class-num="3" class="class_select"><a class="icns brown">@</a></button></td>
                    <td><button data-class-num="4" class="class_select"><a class="icns green">@</a></button></td>
                    <td><button data-class-num="5" class="class_select"><a class="icns yellow">@</a></button></td>
                </tr>
                <!-- Row 2: Ranger, Monk, Knight -->
                <tr>
                    <td><button data-class-num="6" class="class_select"><a class="icns purple">@</a></button></td>
                    <td><button data-class-num="7" class="class_select"><a class="icns cyan">@</a></button></td>
                    <td><button data-class-num="8" class="class_select"><a class="icns magenta">@</a></button></td>
                    <td><button data-class-num="9" class="class_select"><a class="icns pink">@</a></button></td>
                    <td><button data-class-num="10" class="class_select"><a class="icns lime">@</a></button></td>
                </tr>
                <tr>
                    <td><button data-class-num="11" class="class_select"><a class="icns dark_gray">@</a></button></td>
                    <td><button data-class-num="12" class="class_select"><a class="icns light_gray">@</a></button></td>
                    <td><button data-class-num="13" class="class_select"><a class="icns dark_brown">@</a></button></td>
                    <td><button data-class-num="14" class="class_select"><a class="icns gray">@</a></button></td>
                    <td><button data-class-num="0" class="class_select"><a class="icns white">@</a></button></td>
                </tr>
            </table>
        </div>

        <div id="barracks">
            <h3>Central Command</h3>
            <p id="incoming_offensive">Next Offensive: 3 Round(s)</p>
            <table>
                <tr>
                    <td id="slot_10_terrain">10</td>
                    <td id="slot_10_route">X</td>
                    <td id="slot_10_weather"></td>
                </tr>
                <tr>
                    <td id="slot_9_terrain">9</td>
                    <td id="slot_9_route">X</td>
                    <td id="slot_9_weather"></td>
                </tr>
                <tr>
                    <td id="slot_8_terrain">8</td>
                    <td id="slot_8_route">X</td>
                    <td id="slot_8_weather"></td>
                </tr>
                <tr>
                    <td id="slot_7_terrain">7</td>
                    <td id="slot_7_route">X</td>
                    <td id="slot_7_weather"></td>
                </tr>
                <tr>
                    <td id="slot_6_terrain">6</td>
                    <td id="slot_6_route">X</td>
                    <td id="slot_6_weather"></td>
                </tr>
                <tr>
                    <td id="slot_5_terrain">5</td>
                    <td id="slot_5_route">X</td>
                    <td id="slot_5_weather"></td>
                </tr>
                <tr>
                    <td id="slot_4_terrain">4</td>
                    <td id="slot_4_route">X</td>
                    <td id="slot_4_weather"></td>
                </tr>
                <tr>
                    <td id="slot_3_terrain">3</td>
                    <td id="slot_3_route">X</td>
                    <td id="slot_3_weather"></td>
                </tr>
                <tr>
                    <td id="slot_2_terrain">2</td>
                    <td id="slot_2_route">X</td>
                    <td id="slot_2_weather"></td>
                </tr>
                <tr>
                    <td id="slot_1_terrain">1</td>
                    <td id="slot_1_route">X</td>
                    <td id="slot_1_weather"></td>
                </tr>
            </table>
        </div>
    </body>
</html>
