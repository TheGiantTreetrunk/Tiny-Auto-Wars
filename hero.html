<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Fighter Combat Preview - Clean Recoil Bounce</title>
    <style>
        /* Base page layout - using your project's background aesthetic */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: monospace;
        }

        /* The Arena Scene Wrapper - matches your dark clay box style (#542b29) */
        .scene {
            position: relative;
            width: 650px;
            height: 220px;
            background-color: #542b29;
            border: 4px solid #9a9a8e;
            box-shadow: 5px 5px 5px #000000;
            overflow: hidden;
        }

        /* Mid-ground floor divider line */
        .floor-line {
            position: absolute;
            bottom: 45px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #9a9a8e;
            opacity: 0.4;
        }

        /* --- THE HERO CARDS --- */
        .hero-card {
            position: absolute;
            bottom: 25px;
            width: 90px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transform-origin: bottom center; /* Pivot point at characters' feet */
        }

        /* Left Unit Start Placement */
        .hero-left {
            left: 40px;
            animation: chargeAndHitLeft 2.8s infinite;
        }

        /* Right Unit Start Placement */
        .hero-right {
            right: 40px;
            animation: chargeAndHitRight 2.8s infinite;
        }

        /* Level Badge - using your topnav dark red (#7c142c) */
        .card-lvl {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: #7c142c;
            border: 1px solid #9c6b65;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            box-shadow: 1px 1px 2px #000;
        }

        /* Large Character Display */
        .card-sprite {
            font-size: 46px;
            font-weight: bold;
            user-select: none;
            margin-bottom: 4px;
        }

        /* Stat Pill - styled to mimic the Super Auto Pets layout */
        .card-stats-pill {
            display: flex;
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid #9a9a8e;
            padding: 2px 6px;
            gap: 5px;
            box-shadow: 2px 2px 0px #000000;
        }

        .stat-node {
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* --- NEON TEXT CORES WITH GLOW EFFECTS --- */
        .neon-red     { color: #ff2a2a !important; text-shadow: 0 0 6px #ff2a2a; }
        .neon-magenta { color: #ff007f !important; text-shadow: 0 0 6px #ff007f; }
        .neon-yellow  { color: #ffea00 !important; text-shadow: 0 0 5px #ffea00; }
        .neon-lime    { color: #39ff14 !important; text-shadow: 0 0 5px #39ff14; }
        .neon-purple  { color: #bd00ff !important; text-shadow: 0 0 6px #bd00ff; }

        /* --- SQUASH, STRETCH & IMPACT ANIMATION KEYFRAMES --- */
        
        /* Left Attacker Profile (Fighter) */
        @keyframes chargeAndHitLeft {
            0% {
                transform: translateX(0) scale(1) rotate(0deg);
            }
            /* Step 1: Slow wind-up anticipation. Leans back, compresses low. */
            15% {
                transform: translateX(-10px) scale(0.95, 1.05) rotate(-12deg);
            }
            /* Step 2: The Dash. Launches forward horizontally stretching out. */
            32% {
                transform: translateX(100px) scale(1.15, 0.85) rotate(8deg);
            }
            /* Step 3: IMPACT! Instantly squashes flat right at the center dividing line. */
            35% {
                transform: translateX(185px) scale(0.75, 1.3) rotate(0deg);
            }
            /* Step 4: RECOIL BOUNCE! Snaps back slightly from the hit but stays upright */
            40% {
                transform: translateX(160px) scale(1.05, 0.95) rotate(-3deg);
            }
            /* Step 5: Settles into position on their own side briefly before retreating */
            52% {
                transform: translateX(160px) scale(1) rotate(0deg);
            }
            /* Step 6: Smoothly walks backward to baseline. */
            75%, 100% {
                transform: translateX(0) scale(1) rotate(0deg);
            }
        }

        /* Right Attacker Profile (Artillerist) */
        @keyframes chargeAndHitRight {
            0% {
                transform: translateX(0) scale(1) rotate(0deg);
            }
            /* Step 1: Slow wind-up anticipation. Leans back, compresses low. */
            15% {
                transform: translateX(10px) scale(0.95, 1.05) rotate(12deg);
            }
            /* Step 2: The Dash. Launches forward horizontally stretching out. */
            32% {
                transform: translateX(-100px) scale(1.15, 0.85) rotate(-8deg);
            }
            /* Step 3: IMPACT! Instantly squashes flat right at the center dividing line. */
            35% {
                transform: translateX(-185px) scale(0.75, 1.3) rotate(0deg);
            }
            /* Step 4: RECOIL BOUNCE! Snaps back slightly from the hit but stays upright */
            40% {
                transform: translateX(-160px) scale(1.05, 0.95) rotate(3deg);
            }
            /* Step 5: Settles into position on their own side briefly before retreating */
            52% {
                transform: translateX(-160px) scale(1) rotate(0deg);
            }
            /* Step 6: Smoothly walks backward to baseline. */
            75%, 100% {
                transform: translateX(0) scale(1) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="floor-line"></div>

        <div class="hero-card hero-left">
            <div class="card-lvl">Lvl 2</div>
            <div class="card-sprite neon-red">@</div>
            <div class="card-stats-pill">
                <div class="stat-node"><span class="neon-yellow">|</span> 6</div>
                <div class="stat-node"><span class="neon-red">~</span> 15</div>
                <div class="stat-node"><span class="neon-purple">{</span> 12</div>
            </div>
        </div>

        <div class="hero-card hero-right">
            <div class="card-lvl">Lvl 1</div>
            <div class="card-sprite neon-magenta">@</div>
            <div class="card-stats-pill">
                <div class="stat-node"><span class="neon-yellow">|</span> 9</div>
                <div class="stat-node"><span class="neon-red">~</span> 10</div>
                <div class="stat-node"><span class="neon-purple">{</span> 3</div>
            </div>
        </div>
    </div>

</body>
</html>
