	function loading() {
		var pp = Math.floor(Math.random() * 5);
		var pu = eval('prop' + pp);
		document.getElementById("prop").src = pu;
	}
	
	function Reset() {
		var x = document.getElementById("myCheck1").checked;
		var y = document.getElementById("myCheck2").checked;
		var z = document.getElementById("myCheck3").checked;
		
		var a = document.getElementById("myCheck4").checked;
		var b = document.getElementById("fnt_0").value;
		var h = document.getElementById("fnt_1").value;
		
		infinite_money = x;
		all_levels = z;
		all_heroes = y;
		turn_based = a;
		attacker_font_color = b;
		defender_font_color = h;
		
		load();
		console.log("atk = " + b);
		console.log("def = " + h);
	}

		alert("Hello World!");
	}

	setInterval(function () {Faction_Change()}, 100);
	var fction_change = 0;
	
	function Scene(toload) {
	
		if(toload == 0) {//info
			scene = 0;
			document.getElementById("output").innerHTML = 
			"<h3>About this project</h3>" +
			"<p>This game is intended as a open source concept of auto fighting games. This is intended for others" +
			"who are interested in the concept and have no idea where to start. I don't plan to make money on games." +
			" However, if you enjoyed it and want to donate yes I begrudgingly have a patreon...</p>" +
			"<br><br>" +
			"<h3>How To Play</h3>" +
			"<br><br> <a onclick='test()'>Donate Here.</a><br><a onclick='Scene(15)'>Back</a>";
		}
		
		if(toload == 1) {//load game and configure your game settings
			scene = 1;
			fction_change = 0;
			document.getElementById("output").innerHTML =
			"<h4>Loading World</h4><p>Generating Scenario...</p>";
			var timeout = setTimeout(function(){Scene(10)}, 2000);
			
			if(turn_based == true) {
				next_off = 1;
			} else {
				next_off = 3;
			}
			
			for (var i = 0; i < terr_typ.length; i++) {
				terr_typ[i] = Math.floor(Math.random() * terr_info.length);
			}
			//terr_typ
			
			//load faction start parameters
			var th = eval('fact_' + mn_faction + '_start');
			
			for (var i = 0; i < th.length; i++) {
				npc_lvl[th[i]] = 1;
				mil_per[th[i]] = 2;
				
			}
			
			en_faction = Math.floor(Math.random() * 3);
			
			if(en_faction == mn_faction) {
				if(en_faction == 0) {
					en_faction += 1;
				}
				if(en_faction == 3) {
					en_faction -= 1;
				}
				if(en_faction == 1) {
					en_faction -= 1;
				}
				if(en_faction == 2) {
					en_faction += 1;
				}
			}
		}
		
		if(toload == 2) {//home page
			scene = 2;
			clearTimeout(timeout);
			var comment = "";
			switch(next_str) {
			  case 0:
				comment = "(Weak)";
				break;
			  case 1:
				comment = "(Average)";
				break;
			  case 2:
				comment = "(Strong)";
				break;
			  case 3:
				comment = "(Steamroller)";
				break;
			  default:
				// code block
			}
			document.getElementById("output").innerHTML =
			"<center><h4>The War Room</h4>" +
			"<table>" +
			"<tr>" +
			"<td><img id ='fct_0' class='flg'></td>" +
			"<td><p class='tbltxt'>vs.</p></td>" +
			"<td><img id ='fct_1' class='flg'></td>" +
			"</tr>" +
			"<tr>" +
			"<td></td>" +
			"<td><a onclick='Scene(3)'>Battle!</a></td>" +
			"<td></td>" +
			"</tr>" +
			"</table></center>" +
			"<br><br><br>" +
			"<progress id='indicator_prog_bar2' value='32' max='100'> 32% </progress>" + " | " + "<a id='progresstot'>32%</a>" +
			"<br><br>" +
			"<p id='quickstats'></p><br><br>" +
			"<a onclick='Scene(2)'>HQ</a>" + " " + "<a onclick='Scene(4)'>Barracks</a>" + " " + "<a onclick='Scene(5)'>Surplus</a>" + " " + "<a onclick='Scene(11)'>Map</a>";
			
			var gg = (next_nodes + 1);
			var gi = next_nodes;
			document.getElementById("quickstats").innerHTML = 
			"Defending | " + terr_info[terr_typ[gi]] + "<br>" + 
			"Attacking | " + terr_info[terr_typ[gg]] + "<br><br>" + 
			"Units | " + army_size + " / " + army_limit  + "<br>" +
			"Level | " + user_level + "<br>" +
			"Score | " + user_score + "<br>" + 
			"Gold | " + user_gold + "<br><br>" +
			"Next Offensive | " + next_off + " Rounds" + "<br>" + 
			"Offensive Strength | " + next_str + " " + comment + "<br><br>";
			
			var xtc = (nodes_owned / 10 * 100);
			document.getElementById("progresstot").innerHTML = xtc + " %";
			var xz = ((nodes_owned / 10) * 100);
			document.getElementById("indicator_prog_bar2").value = xz + " ";

	function Exchange(action, codeto) {
		
		if(action == 0) {//buy
			if(infinite_money == false) {
				if(user_gold >= npc_cst[codeto]) {
					if(army_size < army_limit) {
						user_gold -= npc_cst[codeto];
						npc_ary[codeto] += 1;
						army_size += 1;
						mil_per[codeto] += 1;
					} else{
						alert("Too many members in your Army!");
					}
				} else {
				alert("Not Enough!");
				}
			} else {
				npc_ary[codeto] += 1;
				mil_per[codeto] += 1;
			}
		}
		
		if(action == 1) {//sell
			if(infinite_money == false) {
				if(npc_ary[codeto] != 0) {
						user_gold += (npc_cst[codeto] / 2);
						npc_ary[codeto] -= 1;
						army_size -= 1;
						mil_per[codeto] -= 1;
				} else {
				alert("These units do not exist!");
				}
			} else {
				alert("Error! Cannot sell units generated using cheats!");
				npc_ary[codeto] -= 1;
				mil_per[codeto] -= 1;
			}
		}
		
		if(action == 2) {//upgrade
			if(infinite_money == false) {
				if(user_gold >= (npc_lvl[codeto] * 100)) {
					user_gold -= (npc_lvl[codeto] * 100);
					npc_lvl[codeto] += 1;	
				} else {
					alert("Not enough gold!");
				}
			} else {
				alert("Error! MAX UPGRADES REACHED!");
			}
		}
		
		var flen = npc_nms.length;
		
		if(action == 3) {//edit team
			tm_oed[0] = tm_one[0];
			tm_oed[1] = tm_one[1];
			tm_oed[2] = tm_one[2];
			tm_oed[3] = tm_one[3];
			tm_oed[4] = tm_one[4];
			
			Scene(6);

		}
		
		if(action == 4) {//raise value
		
			if(tm_oed[codeto] < flen){
				
				tm_oed[codeto] += 1;
				if(tm_oed[codeto] >= flen) {
					tm_oed[codeto] = (flen - 1);
				}
			} else {
				tm_oed[codeto] = 0;
			}
		}
		
		if(action == 5) {//lower value
			if(tm_oed[codeto] > 0){
				tm_oed[codeto] -= 1;
				if(tm_oed[codeto] < 0){
					tm_oed[codeto] = 0;
				}
			} else {
				tm_oed[codeto] = 0;
			}
		}
		
		if(action == 6) {//finish edit
			tm_one[0] = tm_oed[0];
			tm_one[1] = tm_oed[1];
			tm_one[2] = tm_oed[2];
			tm_one[3] = tm_oed[3];
			tm_one[4] = tm_oed[4];
			
			if(pl_bt_st == 0) {
				Scene(4);
			} else {
				Scene(12);
			}
		}
		Scene(scene);
	}
